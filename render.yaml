services:
  - type: web
    name: checkout-recognition-api
    runtime: go
    rootDir: api
    buildCommand: go build -o app .
    startCommand: ./app
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
